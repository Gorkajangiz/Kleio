<div class="login-card">
  <!-- Toggle de tema -->
  <button
    type="button"
    class="theme-toggle"
    [class.theme-toggle--on]="isCushy()"
    (click)="toggleTheme()"
    [attr.aria-label]="isCushy() ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'"
    [attr.aria-pressed]="isCushy()"
  >
    <span class="theme-toggle-knob">
      <span class="theme-toggle-icon">{{ isCushy() ? '☀' : '☾' }}</span>
    </span>
  </button>

  <h1 class="login-title">Iniciar sesión</h1>
  <p class="login-subtitle">Bienvenido de vuelta</p>

  <form class="login-form">
    <div class="field-group">
      <label class="field-label" for="email">Email</label>
      <input class="login-input" type="email" id="email" #txtEmail placeholder="ejemplo@email.com">
    </div>

    <div class="field-group">
      <label class="field-label" for="password">Contraseña</label>
      <input class="login-input" type="password" id="password" #txtPassword placeholder="••••••••">
    </div>

    <div class="login-actions">
      <button type="button" class="submit-btn" (click)="onLogin(txtEmail.value, txtPassword.value)">
        Iniciar sesión
      </button>
      <button type="button" class="cancel-btn" routerLink="/register">
        Crear cuenta
      </button>
    </div>
  </form>
</div>
