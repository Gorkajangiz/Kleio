<div class="login-card">
  <!-- Toggle de tema -->
  <button
    type="button"
    class="theme-toggle"
    [class.theme-toggle--on]="isCushy()"
    (click)="toggleTheme()"
    [attr.aria-label]="isCushy() ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'"
    [attr.aria-pressed]="isCushy()"
  >
    <span class="theme-toggle-knob">
      <span class="theme-toggle-icon">{{ isCushy() ? '☀' : '☾' }}</span>
    </span>
  </button>

  <h1 class="login-title">Iniciar sesión</h1>
  <p class="login-subtitle">Bienvenido de vuelta</p>

  <form class="login-form" (submit)="onLogin($event, txtEmail.value, txtPassword.value)">
    <div class="field-group">
      <label class="field-label" for="email">Email</label>
      <input
        class="login-input"
        type="email"
        id="email"
        #txtEmail
        placeholder="ejemplo@email.com"
        [disabled]="isLoading()"
        autocomplete="email"
      >
    </div>

    <div class="field-group">
      <label class="field-label" for="password">Contraseña</label>
      <div class="password-input-wrapper">
        <input
          class="login-input"
          [type]="showPassword() ? 'text' : 'password'"
          id="password"
          #txtPassword
          placeholder="••••••••"
          [disabled]="isLoading()"
          autocomplete="current-password"
        >
        <button
          type="button"
          class="password-toggle-btn"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
          tabindex="-1"
        >
          @if (showPassword()) {
            <!-- Eye off icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <!-- Eye icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
    </div>

    <label class="checkbox-row">
      <input
        type="checkbox"
        [checked]="keepSession()"
        (change)="toggleKeepSession()"
        [disabled]="isLoading()"
      />
      <span class="checkbox-label">Mantener sesión iniciada</span>
    </label>

    <div class="login-actions">
      <button
        type="submit"
        class="submit-btn"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <app-spinner size="sm" label="Iniciando sesión..." />
        } @else {
          Iniciar sesión
        }
      </button>
      <button
        type="button"
        class="cancel-btn"
        routerLink="/register"
        [disabled]="isLoading()"
      >
        Crear cuenta
      </button>
    </div>
  </form>
</div>
